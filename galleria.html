    <nav class="navbar">

    <section class="gallery-section">

        <!-- RETTANGOLO MINIATURE (Con sensore mouse per fermare lo slide) -->

            <!-- Ho inserito i 31 slot per le tue foto -->
            <img src="imagini/1.jpg" class="thumb active" onclick="manualChange(1, 'Specialità #1', this)">

            <img src="imagini/19.jpg" class="thumb" onclick="manualChange(19, 'Specialità #19', this)">

        </div>
    </section>

    <footer>
        <p>© 2024 Pane & Passione | Via del Forno, 12</p>
    </footer>

    <script>
        let currentIndex = 1;
        const totalImages = 31;
        let autoSlideTimer;

        function changeImage(num, text, element) {
            const currentImg = document.getElementById('current-img');
            const caption = document.getElementById('caption');
            
            currentIndex = num;
            currentImg.style.opacity = 0;
            
            setTimeout(() => {
                currentImg.src = `imagini/${num}.jpg`;
                caption.innerText = text || `Specialità #${num}`;
                currentImg.style.opacity = 1;
            }, 250);
            
            let thumbs = document.getElementsByClassName('thumb');
            for (let t of thumbs) t.classList.remove('active');
            
            if(element) {
                element.classList.add('active');
                element.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
            } else {
                const targetThumb = thumbs[num-1];
                if(targetThumb) {
                    targetThumb.classList.add('active');
                    targetThumb.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                }
            }
        }

        function manualChange(num, text, element) {
            changeImage(num, text, element);
        }

        function startAutoSlide() {
            clearInterval(autoSlideTimer); 
            autoSlideTimer = setInterval(() => {
                let nextIndex;
                do {
                    nextIndex = Math.floor(Math.random() * totalImages) + 1;
                } while (nextIndex === currentIndex);
                
                changeImage(nextIndex, `Specialità #${nextIndex}`);
            }, 4000);
        }

        function stopAutoSlide() {
            clearInterval(autoSlideTimer);
        }

        window.onload = startAutoSlide;
    </script>
</body>
